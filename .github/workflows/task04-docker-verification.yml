
name: Task 04 - Independent Docker Verification

on:
  workflow_dispatch:

jobs:
  verify-docker-image:
    runs-on: ubuntu-latest

    steps:
      - name: Identify independent Docker environment
        run: |
          hostname
          uname -a
          docker --version
          docker info --format 'Docker OS: {{.OperatingSystem}}'

      - name: Pull image from Docker Hub
        run: |
          docker pull nhatnguyen2407/swe40006_task04:1.0
          docker images

      - name: Start container
        run: |
          docker run -d \
            --name task04-independent-test \
            -p 8002:8000 \
            nhatnguyen2407/swe40006_task04:1.0
          docker ps

      - name: Verify HTTP response
        run: |
          for i in $(seq 1 15); do
            if curl --fail --silent http://localhost:8002 > response.txt; then
              break
            fi
            sleep 1
          done

          cat response.txt
          grep -Fx "Hello from my Python Docker app!" response.txt
          echo "Independent Docker deployment: PASSED"

      - name: Show logs and clean up
        if: always()
        run: |
          docker logs task04-independent-test || true
          docker rm -f task04-independent-test || true
