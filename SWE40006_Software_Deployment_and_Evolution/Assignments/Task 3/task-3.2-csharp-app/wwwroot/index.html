<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Task Planner</title>
  <link rel="stylesheet" href="/site.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="container">
    <header>
      <p class="eyebrow">SWE40006 / TASK 3.2</p>
      <h1>Study Task Planner</h1>
      <p class="intro">A small C# web application for organising study tasks.</p>
    </header>

    <section class="panel" aria-labelledby="new-task">
      <h2 id="new-task">Add a task</h2>
      <form id="task-form">
        <label for="task-title">Task name</label>
        <input id="task-title" name="title" type="text" maxlength="80" required placeholder="e.g. Finish deployment report">
        <label for="task-priority">Priority</label>
        <select id="task-priority" name="priority">
          <option>Low</option>
          <option selected>Medium</option>
          <option>High</option>
        </select>
        <button type="submit">Add task</button>
      </form>
    </section>

    <section class="panel" aria-labelledby="task-list-heading">
      <div class="section-heading">
        <h2 id="task-list-heading">My tasks</h2>
        <span id="task-count" class="muted">Loading...</span>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
      <ul id="task-list" aria-label="Study tasks"></ul>
    </section>

    <p class="footnote">Demo storage is in memory. Tasks reset when the server restarts.</p>
  </main>
</body>
</html>
